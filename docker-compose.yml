# SUNOOGO — API, back-office et site (Laravel), avec PostgreSQL, Redis et Reverb.
#
#   cp api/.env.example api/.env    # puis renseigner APP_KEY, APP_URL, mots de passe…
#   docker compose up -d --build
#
# Le conteneur « app » applique les migrations au démarrage ; « queue », « scheduler » et
# « reverb » utilisent la même image. Le serveur Jitsi Meet (visio) se déploie à part :
# https://jitsi.github.io/handbook/docs/devops-guide/devops-guide-docker

x-app: &app
  build:
    context: ./api
    target: runtime
  image: sunoogo/api:latest
  restart: unless-stopped
  env_file: ./api/.env
  environment: &app-env
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-sunoogo}
    DB_USERNAME: ${DB_USERNAME:-sunoogo}
    DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env à la racine}
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    LOG_CHANNEL: stderr
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"

  web:
    build:
      context: ./api
      target: web
    image: sunoogo/web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - storage:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sunoogo}
      POSTGRES_USER: ${DB_USERNAME:-sunoogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env à la racine}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  postgres:
  redis:
