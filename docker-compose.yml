services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sunoogo
      POSTGRES_PASSWORD: sunoogo
      POSTGRES_DB: sunoogo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunoogo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./api
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sunoogo:sunoogo@postgres:5432/sunoogo
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production-32chars
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzIQ==
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
