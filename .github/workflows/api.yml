name: API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  quality:
    name: Style, analyse statique et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, gd, zip, bcmath, pcntl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Les vues du back-office référencent le manifeste Vite : les assets doivent exister pour les tests.
      - run: npm ci --no-audit --no-fund && npm run build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Pest
        run: php artisan test --parallel

  docker:
    name: Image Docker
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire les images (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: api
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
