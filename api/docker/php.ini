; Production
expose_php = Off
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 14M
max_execution_time = 60
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
