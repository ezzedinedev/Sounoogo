<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=fraunces:600|figtree:400,500" rel="stylesheet">
<style>
  body{margin:0;font-family:Figtree,sans-serif;background:#f8f5ff;color:#210e40}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px;width:1136px}
  .tile{border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:center;gap:28px;min-height:200px}
  .white{background:#fff;border:1px solid #ebe4f7}.violet{background:#4c2494}.night{background:#210e40}
  .lockup{display:flex;align-items:center;gap:16px}
  .word{font-family:Fraunces,serif;font-weight:600;font-size:52px;letter-spacing:.02em}
  .tag{font-size:15px;color:#6b5a8a;margin-top:2px}
  .violet .word,.night .word{color:#fff}.violet .tag,.night .tag{color:#ebd6fb}
  .sizes img{display:block}
  .label{font-size:13px;color:#6b5a8a;margin:0 32px -12px}
</style></head><body>
<div class="grid">
  <div class="tile white"><div class="lockup"><img src="logo-mark.svg" width="88"><div><div class="word">SUNOOGO</div><div class="tag">Parle librement. Quelqu'un t'écoute.</div></div></div></div>
  <div class="tile violet"><div class="lockup"><img src="logo-mark-inverse.svg" width="88"><div><div class="word">SUNOOGO</div><div class="tag">Parle librement. Quelqu'un t'écoute.</div></div></div></div>
  <div class="tile white sizes"><img src="logo-mark.svg" width="128"><img src="logo-mark.svg" width="64"><img src="logo-mark.svg" width="32"><img src="logo-mark.svg" width="16"></div>
  <div class="tile night"><img src="app-icon.svg" width="160" style="border-radius:36px"><img src="app-icon.svg" width="72" style="border-radius:16px"><img src="app-icon.svg" width="160" style="border-radius:50%"></div>
</div>
</body></html>
